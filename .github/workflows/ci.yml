name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Run coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest --cov=pheat --cov-report=term-missing --cov-report=xml

      - name: Build package
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Smoke test built wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/pheat-wheel-smoke
          /tmp/pheat-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/pheat-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pheat-wheel-smoke/bin/pheat --help
          /tmp/pheat-wheel-smoke/bin/python - <<'PY'
          import pheat
          from pheat.examples import list_example_sets, load_example_manifest
          from pheat.schemas import available_schemas, load_schema
          from pheat.sources import list_sources

          assert pheat.__version__ != "0.0.0+unknown"
          assert "arxiv-2507-08955" in list_example_sets()
          assert load_example_manifest("arxiv-2507-08955")["examples"]
          assert "atom-structure" in available_schemas()
          assert load_schema("atom-structure")["$schema"]
          assert list_sources()
          PY

      - name: Type check
        if: matrix.python-version == '3.11'
        run: python -m mypy src/pheat

      - name: Set up Node for generated examples
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build generated examples
        if: matrix.python-version == '3.11'
        run: make examples PYTHON=python JUPYTER=jupyter

      - name: Smoke test CLI
        run: |
          pheat --help
          pheat examples list
          pheat score tests/fixtures/tiny.pdb --model generic

  scientific:
    name: Scientific stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: pheat-ci
          cache-environment: true
          cache-downloads: true

      - name: Run tests with OpenMM/PDBFixer
        shell: micromamba-shell {0}
        run: python -m pytest

      - name: Smoke test installed CLI
        shell: micromamba-shell {0}
        run: |
          pheat --help
          pheat examples run arxiv-2507-08955 --model generic
